name: 更新特价数据

on:
  schedule:
    - cron: "0 4 * * *"   # 每天 04:00 UTC（慕尼黑 05:00/06:00）
  workflow_dispatch:       # 允许在 Actions 页面手动运行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3 pyyaml==6.0.2
      - run: python fetch.py
        env:
          MG_API_KEY: ${{ secrets.MG_API_KEY }}
          MG_CLIENT_KEY: ${{ secrets.MG_CLIENT_KEY }}
      - name: 提交新数据
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/data.json
          git diff --staged --quiet || git commit -m "更新特价数据"
          git push
      # 数据已经提交，通知失败也不影响网页；失败时这次运行会标红，GitHub 会发邮件
      - name: 发送 Telegram 摘要
        run: python notify.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
