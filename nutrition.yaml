    - {label: 牛肉馅, name: [hack], p: 20, f: 15, c: 0}
    - {label: 腌制牛排, name: [steak mariniert, marinierte], p: 20, f: 8, c: 2}
    - {label: 醋焖牛肉（腌制）, name: [sauerbraten], p: 20, f: 5, c: 3}
    - {label: 西冷 / 肋眼, name: [rumpsteak, entrecote, ribeye], p: 22, f: 6, c: 0}
