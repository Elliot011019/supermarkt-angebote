# 营养等级配置（目标：增肌减脂）
#
# 每 100 g 的典型值，按 USDA FoodData Central / 德国 BLS 同类生鲜食品的常见数值取整。
# 是“同类商品的参考值”，不是包装上的标签值；腌制、裹粉的产品按同类加工品估算。
# 热量统一按 4×蛋白 + 9×脂肪 + 4×碳水 计算（Atwater 系数）。
#
# 匹配：在商品所属的第一个类别里，从上往下找第一条命中的规则（不区分大小写，子串匹配）。
#   name —— 商品名里含有其中任意一个
#   desc —— 商品描述里含有其中任意一个
#   两个都写时必须同时满足；都不写就是这个类别的兜底规则。

# 等级：看蛋白质供能比 P% = 4×蛋白 / 热量，蛋白太低时再看脂肪供能比 F%
grades:
  - {grade: A, min_protein_pct: 60, note: 高蛋白低脂，减脂期主力}
  - {grade: B, min_protein_pct: 45, note: 蛋白不错，脂肪略多，控制份量}
  - {grade: C, min_protein_pct: 30, note: 脂肪偏高，偶尔吃}
  - {grade: D, max_fat_pct: 30,     note: 蛋白低但也低脂，当碳水 / 维生素来源}
  - {grade: E,                      note: 低蛋白高脂，减脂期尽量少吃}

# 果蔬另用一套分数：蛋白质不是果蔬的看点，看热量、糖、膳食纤维、维生素 C（每 100 g）。
# 规则里写了 vitc 的就走这套。四项各按下表得分，总分 0–13 分换成等级。
produce:
  points:
    kcal:  {max: [[20, 4], [35, 3], [50, 2], [70, 1]]}    # 热量越低分越高
    sugar: {max: [[3, 3], [6, 2], [10, 1]]}               # 糖 g
    fiber: {min: [[3, 3], [2, 2], [1, 1]]}                # 膳食纤维 g
    vitc:  {min: [[50, 3], [20, 2], [8, 1]]}              # 维生素 C mg
  grades:
    - {grade: A, min_score: 10, note: 低热量低糖、纤维和维 C 都丰富，随便吃}
    - {grade: B, min_score: 7,  note: 减脂友好，日常多吃}
    - {grade: C, min_score: 5,  note: 还行，注意份量（热量或糖稍高）}
    - {grade: D, min_score: 3,  note: 糖偏高，训练前后或少量吃}
    - {grade: E,                note: 高糖低纤维，减脂期少吃}

